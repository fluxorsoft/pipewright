[project]
name = "pipewright-mlops"   # on PyPI; the import and the command stay `pipewright`
version = "1.2.0"
description = "Configurable, governed MLOps on Google Cloud, with a human in the loop for every retrain decision"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Fluxor Software Limited", email = "enterprise@fluxorsoft.com" }]
maintainers = [{ name = "Fluxor Software Limited", email = "enterprise@fluxorsoft.com" }]
keywords = ["mlops", "google-cloud", "vertex-ai", "kubeflow-pipelines", "machine-learning", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.21",
    "tzdata>=2024.1",
    "packaging>=23",   # IANA time zones for schedule validation (Windows has none built in)
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2.18,<4",
    "google-cloud-bigquery>=3.25",
    "google-cloud-aiplatform[pipelines]>=1.70,!=2.0.0",
    "google-auth>=2.30",
    "requests>=2.31",
    "kfp>=2.9,<2.18",       # compile checks: up to the kfp tested (checks/kfp_version.TESTED_KFP); raise both together
    "pyarrow>=15",          # GCS outputs: schema seeds for external tables, erasure in Parquet files
]

launcher = ["flask>=3", "gunicorn>=22"]

[project.urls]
Homepage = "https://www.fluxorsoft.com/pipewright.html"
Repository = "https://github.com/fluxorsoft/pipewright"
Issues = "https://github.com/fluxorsoft/pipewright/issues"

[project.scripts]
pipewright = "pipewright.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2.2"]   # pandas: runtime helper tests

[build-system]
requires = ["hatchling>=1.27"]   # 1.27: SPDX license expressions (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build]
# Do not follow .gitignore files: the repository's `build/` rule (Python build output) would also drop the
# pipewright/build package. Exclusions are explicit and anchored instead.
ignore-vcs = true
exclude = ["/.venv", "/dist", "/.pytest_cache", "/.ruff_cache", "**/__pycache__", "**/*.pyc", "**/.pipewright"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipewright"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "pipewright/examples"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
