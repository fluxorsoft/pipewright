# Pipewright release: push a tag v<version> (the version in pyproject.toml) to publish that version on GitHub.
#
#   ci                the whole of ci.yml: tests, wheel, smoke test, launcher image build
#   version           the tag must be v<pyproject version>, or v<pyproject version>-rehearsal.<n> for a rehearsal
#   publish-launcher  the launcher image, built from the released wheel -> GitHub Container Registry
#                     (ghcr.io/<owner>/pipewright-launcher:<version>), linked to this repository so it inherits the
#                     repository's access; platform teams copy it by digest into their environment's own registry
#   github-release    the GitHub release: the wheel and sdist as files, and the launcher image digest
#
# Keyless: GitHub's built-in token publishes the image and the release; nothing else is configured. A rehearsal
# (v<version>-rehearsal.<n>) publishes a pre-release and an image tagged <version>-rehearsal.<n>, to be deleted
# afterwards. A real version is published once: do not delete and re-create its release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          case "$TAG" in
            "v$version") image_tag="$version"; prerelease=false ;;
            "v$version"-rehearsal.[0-9]*) image_tag="${TAG#v}"; prerelease=true ;;
            *) echo "::error::tag $TAG is neither v$version nor v$version-rehearsal.<n> (pyproject.toml version $version)"
               exit 1 ;;
          esac
          case "$version" in *dev*|*a*|*b*|*rc*) prerelease=true ;; esac
          { echo "version=$version"; echo "image_tag=$image_tag"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  publish-launcher:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build from the released wheel and push to GitHub Container Registry
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.image_tag }}
          TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pipewright-launcher"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f images/launcher.Dockerfile --build-arg VERSION="$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image:$TAG" .
          docker push "$image:$TAG"
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$TAG")"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "Launcher image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, publish-launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.publish-launcher.outputs.image }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          Pipewright $VERSION

          - **Python package:** download the wheel below (\`gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY\`)
            and install it, or put it in your organization's package index and pin \`pipewright-mlops[gcp]==$VERSION\`.
          - **Launcher image:** copy it into your environment's own registry by digest, then pin that digest in the
            platform's Terraform:
            \`$IMAGE\`

          What changed: CHANGELOG.md. What stays stable: STABILITY.md.
          EOF
          flag=""; [ "$PRERELEASE" = true ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Pipewright $GITHUB_REF_NAME" \
            --notes-file notes.md $flag
