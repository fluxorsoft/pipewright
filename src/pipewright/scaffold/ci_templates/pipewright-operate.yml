# Generated by `pipewright ci init`. Day-to-day operations, run by hand from the Actions tab. The GitHub
# environment is the approval gate: give production required reviewers, and the CLI's --approve flag is passed
# only after GitHub has approved the job.
#
# Erasure (`pipewright data erase`) is deliberately not here: the keys are personal data and would end up in
# workflow inputs and logs. Run it from a controlled workstation or job.
name: pipewright-operate

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [@@ENV_CHOICES@@]
      usecase:
        description: Use case name
        type: string
        required: true
      action:
        type: choice
        options:
          - status
          - monitor-status
          - run
          - rollback
          - model-list
          - model-approve
          - deploy-model
          - deploy-canary
          - promote-canary
          - undeploy-canary
          - undeploy-model
      pipeline:
        description: "run: training or inference"
        type: choice
        options: [training, inference]
        default: training
      source_uri:
        description: "run: gs:// path of the data"
        type: string
        default: ""
      version:
        description: "model-approve: version number; rollback: release id (empty: previous)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: pipewright-operate-${{ inputs.environment }}-${{ inputs.usecase }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: @@RUNS_ON@@
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      UC: ${{ inputs.usecase }}
      ACTION: ${{ inputs.action }}
      PIPELINE: ${{ inputs.pipeline }}
      SOURCE_URI: ${{ inputs.source_uri }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Launcher URL
        if: inputs.action == 'run'
        id: launcher
        run: echo "url=$(pipewright run --env "$ENV" --usecase "$UC" --print-launcher-url)" >> "$GITHUB_OUTPUT"
      - name: ID token for the launcher
        # Without Workload Identity Federation, `pipewright run` gets the token from the runner's own identity.
        if: inputs.action == 'run' && vars.GCP_WIF_PROVIDER != ''
        id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.launcher.outputs.url }}
          id_token_include_email: true
      - name: ${{ inputs.action }}
        env:
          PIPEWRIGHT_ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          set -o pipefail
          p() { pipewright "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          case "$ACTION" in
            status)          p status --env "$ENV" --usecase "$UC" ;;
            monitor-status)  p monitor status --env "$ENV" --usecase "$UC" ;;
            run)             p run --env "$ENV" --usecase "$UC" --pipeline "$PIPELINE" --source-uri "$SOURCE_URI" \
                               --run-key "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ;;
            rollback)        p rollback --env "$ENV" --usecase "$UC" ${VERSION:+--to "$VERSION"} ;;
            model-list)      p model list --env "$ENV" --usecase "$UC" ;;
            model-approve)   p model approve --env "$ENV" --usecase "$UC" --version "$VERSION" --approve ;;
            deploy-model)    p deploy-model --env "$ENV" --usecase "$UC" --approve ;;
            deploy-canary)   p deploy-model --env "$ENV" --usecase "$UC" --canary --approve ;;
            promote-canary)  p deploy-model --env "$ENV" --usecase "$UC" --promote --approve ;;
            undeploy-canary) p deploy-model --env "$ENV" --usecase "$UC" --undeploy-canary --approve ;;
            undeploy-model)  p deploy-model --env "$ENV" --usecase "$UC" --undeploy ;;
          esac
