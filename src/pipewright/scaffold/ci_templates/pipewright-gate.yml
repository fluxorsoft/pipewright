# Generated by `pipewright ci init`. One decision, gated by the required reviewers of a GitHub environment
# (FR-56): pipewright-decisions dispatches it; the job waits until a reviewer approves, then runs the decision's
# own pipewright command. The command is never taken from the inputs: after approval the job reads the pending
# decisions again and runs the one with this ID, only if it is still pending and gated by this environment.
#
# The gate is <environment> for model approvals and loops, and <environment>-<group> for each approver group of a
# retrain case (D-120): give each of those GitHub environments the variables of <environment>, its group's people
# as required reviewers, and "Prevent self-review". The reviewers, their comment and this run are recorded on the
# decision's event (PIPEWRIGHT_APPROVAL, D-121, D-122).
name: pipewright-gate
run-name: gate ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [@@ENV_CHOICES@@]
      gate:
        description: GitHub environment whose reviewers decide
        type: string
        required: true
      id:
        description: "Decision ID, from `pipewright decisions pending`"
        type: string
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: pipewright-gate-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: @@RUNS_ON@@
    environment: ${{ inputs.gate }}
    env:
      ENV: ${{ inputs.environment }}
      GATE: ${{ inputs.gate }}
      ID: ${{ inputs.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Still pending
        id: item
        run: |
          pipewright decisions pending --env "$ENV" --json > "$RUNNER_TEMP/pending.json"
          if ! jq -e --arg id "$ID" '.[] | select(.id == $id)' "$RUNNER_TEMP/pending.json" > "$RUNNER_TEMP/item.json"; then
            echo "$ID is no longer pending (decided elsewhere): nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=$(jq -r '.gate // ""' "$RUNNER_TEMP/item.json")
          if [ "$expected" != "$GATE" ]; then
            echo "::error::$ID is gated by the GitHub environment '$expected', not '$GATE'"
            exit 1
          fi
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "launcher_1=$(jq -r '.launchers[0] // ""' "$RUNNER_TEMP/item.json")" >> "$GITHUB_OUTPUT"
          echo "launcher_2=$(jq -r '.launchers[1] // ""' "$RUNNER_TEMP/item.json")" >> "$GITHUB_OUTPUT"
      - name: Approval record
        if: steps.item.outputs.pending == 'true'
        env:
          REQUESTED_BY: ${{ github.triggering_actor }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/approvals.json"
          record=$(jq -c --arg gate "$GATE" --arg run "$run_url" --arg by "$REQUESTED_BY" '
            [.[] | select(.state == "approved" and any(.environments[]; .name == $gate))] as $a
            | {gate: $gate, run_url: $run, requested_by: $by, reviewers: [$a[].user.login],
               comment: ([$a[].comment | select(. != null and . != "")] | join("; "))}' "$RUNNER_TEMP/approvals.json")
          if [ "$(jq '.reviewers | length' <<<"$record")" = 0 ]; then
            echo "::error::nobody approved this run in '$GATE': give the GitHub environment required reviewers"
            exit 1
          fi
          echo "PIPEWRIGHT_APPROVAL=$record" >> "$GITHUB_ENV"
          echo "approved in $GATE by $(jq -r '.reviewers | join(", ")' <<<"$record")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ID token for launcher 1
        if: steps.item.outputs.launcher_1 != '' && vars.GCP_WIF_PROVIDER != ''
        id: token1
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.item.outputs.launcher_1 }}
          id_token_include_email: true
      - name: ID token for launcher 2
        if: steps.item.outputs.launcher_2 != '' && vars.GCP_WIF_PROVIDER != ''
        id: token2
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.item.outputs.launcher_2 }}
          id_token_include_email: true
      - name: Decide
        if: steps.item.outputs.pending == 'true'
        env:
          U1: ${{ steps.item.outputs.launcher_1 }}
          U2: ${{ steps.item.outputs.launcher_2 }}
          T1: ${{ steps.token1.outputs.id_token }}
          T2: ${{ steps.token2.outputs.id_token }}
        run: |
          PIPEWRIGHT_ID_TOKENS=$(jq -nc --arg u1 "$U1" --arg t1 "$T1" --arg u2 "$U2" --arg t2 "$T2" \
            '[{key: $u1, value: $t1}, {key: $u2, value: $t2}] | map(select(.key != "" and .value != "")) | from_entries')
          export PIPEWRIGHT_ID_TOKENS
          command=$(jq -r '.command | @sh' "$RUNNER_TEMP/item.json")
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          eval "pipewright $command" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
