# Generated by `pipewright ci init`. On a schedule (@@DECISIONS_CRON@@, UTC; `ci init --decisions-cron` changes it): what
# waits for a decision in each environment
# (`pipewright decisions pending`). Closed retrain loops that need no person are advanced here; every other
# decision gets a pipewright-gate run, which waits for the reviewers of its GitHub environment (FR-56).
#
# The job runs in the GitHub environment <environment>-decisions: the same variables as <environment>, no
# required reviewers, deployment from the default branch only. It only reads, advances loops and dispatches gates.
name: pipewright-decisions

on:
  schedule:
    - cron: "@@DECISIONS_CRON@@"
  workflow_dispatch:

# bash -eo pipefail: a failing pipewright command fails its step even when its output is piped to tee.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: pipewright-decisions
  cancel-in-progress: false

jobs:
  decisions:
    runs-on: @@RUNS_ON@@
    strategy:
      fail-fast: false
      matrix:
        environment: [@@ENV_CHOICES@@]
    environment: ${{ matrix.environment }}-decisions
    env:
      ENV: ${{ matrix.environment }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Pending
        id: pending
        run: |
          pipewright decisions pending --env "$ENV" --json > "$RUNNER_TEMP/pending.json"
          pipewright decisions pending --env "$ENV" | tee -a "$GITHUB_STEP_SUMMARY"
          launchers=$(jq -c '[.[] | select(.kind == "loop-advance") | .launchers[]] | unique' "$RUNNER_TEMP/pending.json")
          echo "launcher_1=$(jq -r '.[0] // ""' <<<"$launchers")" >> "$GITHUB_OUTPUT"
          echo "launcher_2=$(jq -r '.[1] // ""' <<<"$launchers")" >> "$GITHUB_OUTPUT"
      # A loop calls the launchers of both environments. Without Workload Identity Federation the runner's own
      # identity issues the tokens.
      - name: ID token for launcher 1
        if: steps.pending.outputs.launcher_1 != '' && vars.GCP_WIF_PROVIDER != ''
        id: token1
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.pending.outputs.launcher_1 }}
          id_token_include_email: true
      - name: ID token for launcher 2
        if: steps.pending.outputs.launcher_2 != '' && vars.GCP_WIF_PROVIDER != ''
        id: token2
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.pending.outputs.launcher_2 }}
          id_token_include_email: true
      - name: Advance closed retrain loops
        env:
          U1: ${{ steps.pending.outputs.launcher_1 }}
          U2: ${{ steps.pending.outputs.launcher_2 }}
          T1: ${{ steps.token1.outputs.id_token }}
          T2: ${{ steps.token2.outputs.id_token }}
        run: |
          PIPEWRIGHT_ID_TOKENS=$(jq -nc --arg u1 "$U1" --arg t1 "$T1" --arg u2 "$U2" --arg t2 "$T2" \
            '[{key: $u1, value: $t1}, {key: $u2, value: $t2}] | map(select(.key != "" and .value != "")) | from_entries')
          export PIPEWRIGHT_ID_TOKENS
          jq -r '.[] | select(.kind == "loop-advance") | .command | @sh' "$RUNNER_TEMP/pending.json" |
            while read -r command; do
              eval "pipewright $command" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            done
      # approvals.deploy_model on_register (Pipewright 1.2.0): a new default version that passes its gates is deployed
      # here, without a person (deploy-model checks the gates again).
      - name: Deploy registered models
        run: |
          jq -r '.[] | select(.kind == "deploy-auto") | .command | @sh' "$RUNNER_TEMP/pending.json" |
            while read -r command; do
              eval "pipewright $command" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            done
      - name: Request gates
        run: |
          # One gate run per decision: none while one is queued, waiting for its reviewers, or running.
          open=$(gh run list --workflow pipewright-gate.yml --limit 200 --json displayTitle,status \
            -q '[.[] | select(.status != "completed") | .displayTitle]')
          jq -c '.[] | select(.gate != null)' "$RUNNER_TEMP/pending.json" | while read -r item; do
            id=$(jq -r .id <<<"$item"); gate=$(jq -r .gate <<<"$item")
            if jq -e --arg t "gate $id" 'index($t) != null' <<<"$open" > /dev/null; then
              echo "waiting: $id (GitHub environment $gate)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh workflow run pipewright-gate.yml --ref "$GITHUB_REF_NAME" -f environment="$ENV" -f gate="$gate" -f id="$id"
            echo "requested: $id (GitHub environment $gate): $(jq -r .summary <<<"$item")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
