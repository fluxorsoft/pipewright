# Generated by `pipewright ci init`. Shared setup for the Pipewright workflows: Python, uv, Google Cloud
# credentials, and the pinned Pipewright CLI in a virtual environment of its own.
#
# Works on GitHub-hosted and self-hosted runners:
#   setup_tools: "off"   the runner image already has Python 3.11 and uv (no downloads from the internet)
#   wif_provider: ""     no Workload Identity Federation: use the runner's own identity (a GCE or GKE runner
#                        with a service account attached), via Application Default Credentials
#   pip_index            a private package mirror, e.g. the platform's Artifact Registry Python repository
name: pipewright-setup
description: Install Pipewright and authenticate to Google Cloud as the environment's MLOps CI identity
inputs:
  wif_provider:
    description: Workload Identity provider (GCP_WIF_PROVIDER); empty to use the runner's own identity
    required: false
    default: ""
  service_account:
    description: MLOps CI service account (PIPEWRIGHT_SERVICE_ACCOUNT); needed with Workload Identity Federation
    required: false
    default: ""
  pip_spec:
    description: What to install (PIPEWRIGHT_PIP_SPEC), e.g. pipewright-mlops[gcp]==1.1.0
    required: true
  pip_index:
    description: Extra package index (PIPEWRIGHT_PIP_INDEX)
    required: false
    default: ""
  setup_tools:
    description: '"off" when the runner image already has Python 3.11 and uv (PIPEWRIGHT_SETUP_TOOLS)'
    required: false
    default: "on"
runs:
  using: composite
  steps:
    - if: inputs.setup_tools != 'off'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - if: inputs.setup_tools != 'off'
      uses: astral-sh/setup-uv@v5
    - if: inputs.wif_provider != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.service_account }}
    - name: Install Pipewright
      shell: bash
      env:
        PIP_SPEC: ${{ inputs.pip_spec }}
        PIP_INDEX: ${{ inputs.pip_index }}
      run: |
        # A virtual environment per job: nothing leaks between jobs on a reused self-hosted runner, and system
        # Python stays untouched (newer distributions refuse system-wide pip installs).
        venv="${RUNNER_TEMP}/pipewright-venv"
        python3 -m venv "$venv"
        echo "$venv/bin" >> "$GITHUB_PATH"
        if [ -n "$PIP_INDEX" ]; then
          "$venv/bin/pip" install keyrings.google-artifactregistry-auth
          "$venv/bin/pip" install --extra-index-url "$PIP_INDEX" "$PIP_SPEC"
        else
          "$venv/bin/pip" install "$PIP_SPEC"
        fi
        "$venv/bin/pipewright" --version
