# Generated by `pipewright ci init`. Pull-request checks for every changed use case, against @@FIRST_ENV@@:
# validate, unit tests, live doctor (compiles every pipeline), and dry runs of tables, schedules and alerts.
# The resolved configuration is attached to the run for review. Nothing is changed in Google Cloud.
name: pipewright-pr

on:
  pull_request:
    paths: ["usecases/**", "environments/**", ".github/workflows/pipewright-*.yml", ".github/actions/pipewright-setup/**"]

# bash -eo pipefail: a failing pipewright command fails its step even when its output is piped to tee.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write          # Workload Identity Federation

concurrency:
  group: pipewright-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: @@RUNS_ON@@
    outputs:
      usecases: ${{ steps.changed.outputs.usecases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files="$(git diff --name-only "$BASE"...HEAD)"
          if echo "$files" | grep -qE '^(environments/|\.github/)'; then
            names="ALL"                                 # shared files changed: check everything
          else
            names="$(echo "$files" | grep '^usecases/' | cut -d/ -f2 | sort -u)"
          fi
          python - "$names" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          names = sys.argv[1].split()
          if names == ["ALL"]:                                       # shared files changed, or a full run
              names = sorted(os.listdir("usecases"))
          names = [n.strip("/") for n in names if os.path.isfile(f"usecases/{n.strip('/')}/usecase.yaml")]
          print("usecases=" + json.dumps(names))
          PY

  check:
    needs: changes
    if: needs.changes.outputs.usecases != '[]'
    runs-on: @@RUNS_ON@@
    environment: @@FIRST_ENV@@
    strategy:
      fail-fast: false
      matrix:
        usecase: ${{ fromJSON(needs.changes.outputs.usecases) }}
    env:
      ENV: @@FIRST_ENV@@
      UC: ${{ matrix.usecase }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Validate
        run: pipewright validate --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        run: pipewright test --env "$ENV" --usecase "$UC"
      - name: Doctor (live checks, compiles every pipeline)
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pipewright doctor --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Planned changes (dry runs)
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pipewright tables sync --env "$ENV" --usecase "$UC" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          pipewright alerts sync --env "$ENV" --usecase "$UC" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ vars.PIPEWRIGHT_SCHEDULES }}" != "off" ]; then
            pipewright schedules sync --env "$ENV" --usecase "$UC" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolved configuration
        run: pipewright resolve --env "$ENV" --usecase "$UC" > "resolved-$UC-$ENV.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-${{ matrix.usecase }}-@@FIRST_ENV@@
          path: resolved-${{ matrix.usecase }}-@@FIRST_ENV@@.yaml
