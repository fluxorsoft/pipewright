# Generated by `pipewright ci init` (Pipewright 1.2) for the environments whose releases come from another
# (environments/<env>.yaml promotion.from): @@PROMOTIONS@@. Started by hand once the release is live in the
# source environment and a model it trained is the champion there. The job runs in the destination's GitHub
# environment: its required reviewers approve before anything is promoted, and the run records who started it.
# The destination's own policy (promote_model) still decides whether the promoted model becomes its champion:
# approve_model passes --approve, which records the approval.
name: pipewright-promote
run-name: promote ${{ inputs.usecase }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote to
        type: choice
        options: [@@PROMOTED_CHOICES@@]
      usecase:
        description: Use case to promote
        type: string
        required: true
      release:
        description: "Release ID to promote (empty: the one live in the source environment)"
        type: string
        default: ""
      approve_model:
        description: "Also make the promoted model the destination's champion"
        type: boolean
        default: false

# bash -eo pipefail: a failing pipewright command fails its step even when its output is piped to tee.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write          # Workload Identity Federation

concurrency:
  group: pipewright-promote-${{ inputs.environment }}-${{ inputs.usecase }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: @@RUNS_ON@@
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      UC: ${{ inputs.usecase }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # promote checks out the release's own commit
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Promote
        run: |
          set -o pipefail
          case "$ENV" in
@@PROMOTE_CASES@@
            *) echo "$ENV has no promotion.from"; exit 1 ;;
          esac
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          pipewright promote --from "$SOURCE" --to "$ENV" --usecase "$UC" ${RELEASE:+--release "$RELEASE"} \
              ${{ inputs.approve_model && '--approve' || '' }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # A use case that retrains here (model.promotion: retrain) has no model until it trains.
          pipewright model list --env "$ENV" --usecase "$UC" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Schedules
        if: vars.PIPEWRIGHT_SCHEDULES != 'off'
        run: pipewright schedules sync --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alerts
        run: pipewright alerts sync --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
