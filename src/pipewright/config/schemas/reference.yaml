# What each use case key means: one line per key, under `spec`. Shown when hovering a key in the editor (the
# exported schemas carry these) and by `pipewright explain <key>`. `<name>` stands for a name you choose.
# A test keeps this file and usecase.schema.json in step: every key described, no description without a key.

tenant: The tenant this use case belongs to, as named in the environment manifest. Given to you by the platform team; it decides the service account, BigQuery dataset and landing prefix the use case uses.
run_in: The environments this use case runs in, by name (Pipewright 1.1), for a use case meant for some environments only, such as one serving on GKE. Whole-repo commands skip it elsewhere with a note; naming it in another environment, or promoting it to one, is refused. Left out, it runs in every environment.
include: Glob patterns, relative to the use case folder, of files that hold the rest of the spec. Each file holds one or more top-level sections; a section lives in exactly one file.

resources: Overrides of the tenant's resources from the manifest. Normally left out; the platform team's manifest fills them.
resources.runner_service_account: The service account pipeline runs use. Comes from the tenant in the manifest.
resources.bigquery_dataset: The BigQuery dataset for the use case's tables. Comes from the tenant in the manifest.
resources.landing_prefix: The landing bucket prefix where files for this use case arrive. Comes from the tenant in the manifest.
resources.outputs_uri: The gs:// location for outputs when outputs.store is gcs or both. Comes from the tenant in the manifest.

pipeline: A single pipeline, shorthand for pipelines.training. Use `pipelines` for training plus inference.
pipeline.file: The Python file, relative to the use case folder, that defines the Kubeflow pipeline.
pipeline.function: The name of the pipeline function (decorated with @dsl.pipeline) in that file.
pipelines: The use case's pipelines by role. Training is required for model work; inference is optional.
pipelines.training: The pipeline that trains, evaluates and registers a model.
pipelines.training.file: The Python file, relative to the use case folder, that defines the training pipeline.
pipelines.training.function: The name of the training pipeline function in that file.
pipelines.inference: The pipeline that scores new data with the champion model.
pipelines.inference.file: The Python file, relative to the use case folder, that defines the inference pipeline.
pipelines.inference.function: The name of the inference pipeline function in that file.

components: Where the pipeline components' code lives. It is built into the component image every step runs in.
components.dir: The folder of component code, relative to the use case folder.
components.requirements: The requirements file installed into the component image.
components.base_image: The component image's base instead of the environment's default (Pipewright 1.2.0), for example a CUDA image for GPU training. It must match the environment's approved base images (policies.images.base_images), and the release records it by digest. It needs Python 3.11 with pip on the path (python3, pip), as the default python:3.11-slim has; pin it by digest.
components.ray_requirements: Extra packages for the use case's Ray image (the clusters' nodes), such as torch. The image is built at release on the platform's Ray base image, with the component code.
framework: The ML framework of the component image.

triggers: What starts a run, and which pipeline it starts.
triggers.landing: A run when a file lands under the use case's landing prefix. null turns it off, for example in one environment.
triggers.landing.suffixes: File name endings that start a run when a file lands under the use case's landing prefix, for example [.csv].
triggers.landing.pipeline: The pipeline a landed file starts.
triggers.schedules: Runs on a schedule (Cloud Scheduler jobs, created by `pipewright schedules sync`).
triggers.schedules.name: The schedule's name, unique in the use case.
triggers.schedules.cron: When it runs, in cron syntax, for example "0 6 * * *" (06:00 every day).
triggers.schedules.timezone: The time zone the cron expression is read in, for example Europe/London.
triggers.schedules.source_uri: The gs:// data the scheduled run reads. ${buckets.landing} and other manifest names may be used.
triggers.schedules.pipeline: The pipeline the schedule starts.
triggers.api: Whether the launcher's POST /run may start this use case's pipelines (for scoring on demand and retrains).

parameters: Values passed to every pipeline that declares a parameter of the same name. ${...} references to resources, model and manifest names are filled in.
parameters.<name>: A pipeline parameter value.

resources_per_step: The older name of `steps`, merged with it. Prefer `steps`.
resources_per_step.<name>: A step, by its component name with dashes (train-model for train_model).
resources_per_step.<name>.cpu: CPUs for the step, for example 4 or "500m".
resources_per_step.<name>.memory: Memory for the step, for example 8G.
resources_per_step.<name>.gpu: An accelerator for the step.
resources_per_step.<name>.gpu.type: The accelerator type, for example NVIDIA_TESLA_T4.
resources_per_step.<name>.gpu.count: How many accelerators.
resources_per_step.<name>.retries: How many times a failed step is retried.
resources_per_step.<name>.cache: Whether the step may reuse a cached result from an identical earlier run.
resources_per_step.<name>.ray: A Ray on Agent Platform cluster for this step, for this run only. The launcher creates it, sized within the platform's limits, and deletes it when the step ends.
resources_per_step.<name>.ray.head_machine: The head node's machine type, with at least 16 vCPUs and more than 18 GB (for example n1-standard-16). Left out, the first allowed machine type that is big enough.
resources_per_step.<name>.ray.worker_machine: The worker nodes' machine type. Left out, the same as the head.
resources_per_step.<name>.ray.workers: How many worker nodes, besides the head; 0 runs everything on the head. At most the platform's max_workers.
resources_per_step.<name>.ray.accelerator: An accelerator on each worker (on the head when there are no workers), if the platform allows one.
resources_per_step.<name>.ray.accelerator.type: The accelerator type, for example NVIDIA_TESLA_T4.
resources_per_step.<name>.ray.accelerator.count: How many accelerators per node.
resources_per_step.<name>.ray.max_minutes: The longest the cluster may live; after that, plus a grace period, the launcher removes it. At most the platform's limit.
steps: Compute and behaviour per pipeline step, applied to the compiled pipeline; no pipeline code change needed.
steps.<name>: A step, by its component name with dashes (train-model for train_model).
steps.<name>.cpu: CPUs for the step, for example 4 or "500m".
steps.<name>.memory: Memory for the step, for example 8G.
steps.<name>.gpu: An accelerator for the step.
steps.<name>.gpu.type: The accelerator type, for example NVIDIA_TESLA_T4.
steps.<name>.gpu.count: How many accelerators.
steps.<name>.retries: How many times a failed step is retried.
steps.<name>.cache: Whether the step may reuse a cached result from an identical earlier run.
steps.<name>.ray: A Ray on Agent Platform cluster for this step, for this run only. The launcher creates it, sized within the platform's limits, and deletes it when the step ends. The step itself takes no cpu, memory or gpu.
steps.<name>.ray.head_machine: The head node's machine type, with at least 16 vCPUs and more than 18 GB (for example n1-standard-16). Left out, the first allowed machine type that is big enough.
steps.<name>.ray.worker_machine: The worker nodes' machine type. Left out, the same as the head.
steps.<name>.ray.workers: How many worker nodes, besides the head; 0 runs everything on the head. At most the platform's max_workers.
steps.<name>.ray.accelerator: An accelerator on each worker (on the head when there are no workers), if the platform allows one.
steps.<name>.ray.accelerator.type: The accelerator type, for example NVIDIA_TESLA_T4.
steps.<name>.ray.accelerator.count: How many accelerators per node.
steps.<name>.ray.max_minutes: The longest the cluster may live; after that, plus a grace period, the launcher removes it. At most the platform's limit.

data: The data contract, the label and how data is split. Passed to pipelines in ml_config.
data.contract: What the input data must look like. A run whose data breaks the contract stops before training.
data.contract.columns: The expected columns. `pipewright new-usecase --from-bq` drafts them from a BigQuery table.
data.contract.columns.name: The column name.
data.contract.columns.type: The column's type.
data.contract.columns.required: Whether the column must be present.
data.contract.columns.min: The smallest allowed value.
data.contract.columns.max: The largest allowed value.
data.contract.columns.allowed: The only values allowed.
data.contract.columns.max_null_fraction: The largest share of empty values allowed in this column, 0 to 1.
data.contract.min_rows: The fewest rows a run accepts.
data.contract.max_null_fraction: The largest share of empty values allowed in any column, 0 to 1.
data.contract.unique: Columns whose values must not repeat, such as an ID.
data.contract.allow_extra_columns: Whether columns not in the contract are allowed. When false, they stop the run.
data.label: The column the model learns to predict.
data.label.column: The label column's name.
data.label.values: The label's possible values, for example [0, 1].
data.label.positive: The value that counts as positive for metrics such as precision and recall.
data.label.task: "What the model predicts: binary (the default), multiclass or regression; with BigQuery ML also clustering (kmeans), decomposition (pca) and forecast (arima_plus or AI.FORECAST), Pipewright 1.1. It sets which metrics evaluation, gates, the champion comparison and monitoring accept, and their defaults: auc for binary, f1_macro for multiclass, rmse for regression (lower is better), davies_bouldin_index for clustering, total_explained_variance_ratio for decomposition, mae for forecast. Regression splits random unless data.split.strategy says otherwise."
data.split: How data is divided into training, validation and test sets.
data.split.strategy: random, stratified (keeps the label's proportions) or time (the newest rows are the test set).
data.split.time_column: The column that orders rows in time; needed with strategy time.
data.split.test_fraction: The share of rows held back for testing.
data.split.validation_fraction: The share of rows held back for validation during training.
data.split.seed: The random seed, so a split can be repeated.
data.snapshot_table: "The table, in outputs.bigquery.tables, where the ingest step keeps a copy of exactly what each run read, tagged with run_id (its schema needs run_id, source_uri and ingested_at). `pipewright run --replay <run_id>` reads those rows again, so a rerun of the same release trains on the same data."
data.label_source: "Take the label from a table of events instead of the run's source: a row is 1 when an event for its key falls within window_days after its cut-off, otherwise 0. Rows whose window has not closed by the newest event are dropped, 1s and 0s alike. Applied by training's ingest step (read_source with labels=True)."
data.label_source.table: "The label events: bq://project.dataset.table, with the key columns and a time column. The runner needs read access."
data.label_source.key: The columns that match an event to a row, named the same in both tables. Default data.features_from.entity.columns.
data.label_source.time_column: When each event happened, a date or timestamp column of the label table.
data.label_source.window_days: "How many days after a row's cut-off an event still counts, for example 20 for a purchase within 20 days of sign-up."
data.label_source.cutoff_column: "The row's cut-off in the run's source, a date or timestamp column. Default data.features_from.entity.time_column, else data.split.time_column."
data.features_from: "Read features from feature tables instead of taking every column from the run's source. The source becomes the entity table: the entity IDs, a cut-off time per row and the label. Each row gets the latest feature values at or before its cut-off, so nothing from after it reaches training."
data.features_from.entity: The entity table's key and cut-off columns.
data.features_from.entity.columns: The columns that identify an entity, such as customer_id.
data.features_from.entity.time_column: "The cut-off time of each row: features dated after it are not used. For scoring, set it to the scoring date. A table without this column is cut off at the query time (mark the column required: false in the contract)."
data.features_from.sources: The feature tables to read, owned by whoever produces the features.
data.features_from.sources.table: "A BigQuery feature table or view: bq://project.dataset.table. It has the entity columns, a timestamp column and one column per feature. The runner needs read access."
data.features_from.sources.feature_group: "A feature group registered in the Agent Platform Feature Store, instead of a table. Read from the Feature Registry at each run: its table, entity and time columns, and each feature's column. features then names registered features."
data.features_from.sources.project: The project the feature group is registered in. Default the environment's project.
data.features_from.sources.region: The region the feature group is registered in. Default the environment's region.
data.features_from.sources.entity_columns: The table's entity columns, in the order of entity.columns, when their names differ. Default the same names.
data.features_from.sources.time_column: The table's column saying when each value became true. Default feature_timestamp.
data.features_from.sources.features: The feature columns to take from this table. Each must be in the data contract.
data.features_from.sources.prefix: Added to this table's feature names, when two tables have a feature of the same name.

features: Which columns the model uses.
features.include: Only these columns are features. Left out, every column except the label and those excluded.
features.exclude: Columns never used as features, such as IDs and dates.

training: Hyperparameters, the experiment and tuning.
training.hyperparameters: Values the training step reads, by name (for example epochs, learning_rate).
training.hyperparameters.<name>: A hyperparameter value.
training.seed: The random seed for training, so a run can be repeated.
training.experiment: The Agent Platform experiment runs are recorded in.
training.experiment.name: The experiment's name. Left out, one is named after the use case.
training.tuning: Hyperparameter tuning, which runs several trials and keeps the best.
training.tuning.enabled: Whether training tunes before the final fit.
training.tuning.metric: The metric trials are compared on. Left out, evaluation.primary_metric.
training.tuning.goal: Whether a larger (maximize) or smaller (minimize) metric is better.
training.tuning.max_trials: The most trials in one run.
training.tuning.parallel_trials: How many trials run at the same time.
training.tuning.search_space: The hyperparameters to try, by name, and their ranges.
training.tuning.search_space.<name>: One hyperparameter's range.
training.tuning.search_space.<name>.type: double and integer take min and max; discrete and categorical take values.
training.tuning.search_space.<name>.min: The smallest value tried.
training.tuning.search_space.<name>.max: The largest value tried.
training.tuning.search_space.<name>.values: The values tried.
training.tuning.search_space.<name>.scale: linear, or log for ranges over orders of magnitude such as learning rates.

evaluation: How a trained model is judged before it can become the champion. Pipewright re-checks the gates from the evaluation record.
evaluation.primary_metric: The metric that matters most; used by tuning and the champion comparison when they name none.
evaluation.decision_threshold: The score above which a prediction counts as positive, for the metrics that need one.
evaluation.metrics: The metrics computed on the test set.
evaluation.gates: Minimums and maximums a model must meet. A model that fails one is not registered as a candidate.
evaluation.gates.metric: The metric the gate checks.
evaluation.gates.min: The lowest value allowed.
evaluation.gates.max: The highest value allowed.
evaluation.gates.per_series: For a forecast, every series (bqml.forecast.id_columns) must pass the gate, not only the overall value; the evaluation record holds each series' metrics and `pipewright model list` shows the worst (Pipewright 1.2.0).
evaluation.champion: Comparison with the current champion on the same test data.
evaluation.champion.enabled: Whether a new model must beat the champion.
evaluation.champion.metric: The metric compared. Left out, evaluation.primary_metric.
evaluation.champion.min_improvement: How much better the new model must be.
evaluation.slices: Columns whose values form slices (groups) the model is also measured on.
evaluation.slice_gates: The largest gap allowed between a slice and the overall result.
evaluation.slice_gates.metric: The metric compared per slice.
evaluation.slice_gates.max_gap: The largest amount a slice may be worse than overall.
evaluation.slice_gates.min_rows: Slices with fewer test rows are not checked.

explainability: Which features drive the model's predictions, recorded with each version.
explainability.enabled: Whether training computes feature importance.
explainability.method: How importance is measured.
explainability.top_k: How many of the most important features are recorded.

registry: How versions in the Model Registry become the default (the champion).
registry.set_default: on_approval lets training make a passing version the default; manual waits for `pipewright model approve`. Left out, follows approvals.promote_model.

model_card: Text for the model card stored with each version.
model_card.intended_use: What the model is for and who uses its output.
model_card.out_of_scope: Uses the model is not suitable for.
model_card.limitations: Known weaknesses, such as data it has not seen.
model_card.ethical_considerations: Fairness and other risks, and how they are handled.

inference: Scoring with the champion model.
inference.output_table: The table predictions are written to.
inference.decision_threshold: The score above which a prediction is positive. Left out, evaluation.decision_threshold.

monitoring: Checks run on each inference, for drift, prediction drift and performance against observed outcomes.
monitoring.alerts.events: The events that send an email. run.failed (Pipewright 1.2.0) emails a run that ended failed or cancelled, found by the launcher within the hour.
monitoring.alerts.severity: The severity of the alert policies.
monitoring.drift: Whether the scored data has moved away from the training data, feature by feature.
monitoring.drift.enabled: Whether drift is checked.
monitoring.drift.method: How drift is measured (population stability index).
monitoring.drift.threshold: The drift above which a feature raises an alert. 0.2 is a common choice for PSI.
monitoring.drift.features: The features checked. Left out, all of them.
monitoring.prediction_drift: Whether the model's predictions have moved away from those at training time.
monitoring.prediction_drift.enabled: Whether prediction drift is checked.
monitoring.prediction_drift.threshold: The drift above which an alert is raised.
monitoring.performance: How the model does on outcomes observed after scoring.
monitoring.performance.enabled: Whether performance is checked.
monitoring.performance.labels: Where the observed outcomes are.
monitoring.performance.labels.table: The table of observed outcomes.
monitoring.performance.labels.key: The column that joins outcomes to predictions.
monitoring.performance.labels.time_column: The outcome's cut-off column (Pipewright 1.2.0). With it, each outcome is joined to the score made for that cut-off (the scores table's scored_for), never to a later score that already knows the outcome. Without it, outcomes meet each key's latest score, and validate warns.
monitoring.performance.labels.label: The column holding the observed outcome.
monitoring.performance.metric: The metric computed on observed outcomes.
monitoring.performance.min: The value below which an alert is raised.
monitoring.output_table: The table monitoring results are written to.
monitoring.alerts: Email for Pipewright events, set up by `pipewright alerts sync`.
monitoring.alerts.notify: Email addresses, distribution lists included.

retraining: What drift or a performance drop leads to, and who decides on a retrain.
retraining.mode: off (alerts only), propose (a case opens and a person decides) or candidate (trains a candidate that is never promoted). Write "off" in quotes, since YAML reads a bare off as false (which also means off).
retraining.enabled: The older switch. true means mode propose, false means off.
retraining.when: What may open a retrain case (schedule, drift, performance). The key is `when`, not `on`, because YAML reads on as true.
retraining.cooldown_days: Days after an approved retrain during which new alerts are recorded but open no case.
retraining.source_uri: The training data an approved retrain uses by default; an approver may choose another.
retraining.loop: "The closed retrain loop: production never trains. An approved case here is trained in the environment this one's releases come from (environments/<env>.yaml promotion.from), on this environment's data through a read-only grant, compared with the model this environment serves, validated by a scoring run there, then promoted, approved and verified here. `pipewright loop` drives it."
retraining.loop.enabled: Switch the closed retrain loop on, usually only in production (environments/<env> file). Off, an approved case trains in this environment, as in 1.0.
retraining.loop.safeguards: "Limits on loops started without a person (retraining.mode candidate). Held by one, the case opens for a person to decide. {} gives the defaults: 1 loop per 7 days, pause after 2 failures in a row, drift on 2 runs in a row. Off when not set."
retraining.loop.safeguards.max_loops: "Automatic loops allowed per period (default 1)."
retraining.loop.safeguards.per_days: "The period for max_loops, in days (default 7)."
retraining.loop.safeguards.pause_after_failures: "Automatic loops in a row that end rejected, failed or rolled back before automatic retraining pauses until `pipewright loop resume` (default 2)."
retraining.loop.safeguards.drift_runs: "A drift trigger starts a loop only when this many scoring runs in a row alerted (default 2); before that, no case opens and the next run that alerts counts it."
retraining.loop.canary: "The online canary with automatic rollback, for a model served on an Agent Platform endpoint: after the production approval the loop deploys the candidate as a canary, checks it after the soak window, then gives it all traffic or rolls it back. Off when not set."
retraining.loop.canary.percent: "The canary's share of traffic, in percent (default 10)."
retraining.loop.canary.soak_minutes: "How long the canary serves before it is checked (default 30)."
retraining.loop.canary.max_error_rate_increase: "How much higher the canary's error rate may be than the current version's, as a fraction of requests (default 0.01)."
retraining.loop.canary.max_latency_increase: "How much slower the canary's median latency may be than the current version's, as a ratio (default 0.2)."
retraining.loop.canary.min_requests: "Canary requests in the soak window before latency is compared; fewer, and only errors and the probe judge it (default 50)."
retraining.loop.canary.probe: "Whether the validation rows are sent to the canary; their scores must match what test scored (default true). No request or response is stored."
retraining.loop.data: "Whose data configuration the loop's training run in test reads: test (default, as before) or production (its feature tables and label window, through the read-only loop_readers grant)."
retraining.decisions: How people hear about a retrain case and how long they have to decide.
retraining.decisions.notify: Who is emailed a case's summary and ID. Email never approves anything.
retraining.decisions.publish: Whether decision events also go to the tenant's decision feed (a subscription the platform provides).
retraining.decisions.escalate_after_days: Days without a decision before the case is escalated.
retraining.decisions.escalate_notify: Who is emailed when a case is escalated.
retraining.decisions.digest: Whether a weekly summary of open cases and decisions is sent.
retraining.approvals: Who must agree before a retrain runs.
retraining.approvals.required: Approver groups registered by the platform (approver_groups in the manifest). One approval is needed from each.
retraining.approvals.separate_from_requester: Whether the person who asked for the retrain may also approve it.
retraining.snooze: Putting off a decision.
retraining.snooze.max_days: The longest a case may be snoozed. The environment may set a lower cap.
retraining.snooze.reopen_when_worse_by: A snoozed or declined case re-opens at once when the worst drift (PSI) rises by this much.

data_protection: Personal data in the use case's tables.
data_protection.personal_data_columns: Columns that hold personal data; recorded in the release and kept out of logs.
data_protection.erasure: How a data subject's rows are found for `pipewright data erase`.
data_protection.erasure.key_column: The column that identifies a data subject, such as customer_id.

bqml: "BigQuery ML as the training engine. Pipewright then provides the training and scoring pipelines: they run on the environment's orchestrator, their steps submit BigQuery jobs, and the data and the model stay in BigQuery. A bqml use case has no pipelines, components or framework of its own."
bqml.model_type: "The BigQuery ML model type, matching data.label.task: logistic_reg, boosted_tree_classifier or random_forest_classifier for binary and multiclass; linear_reg, boosted_tree_regressor or random_forest_regressor for regression; kmeans for clustering, pca for decomposition and arima_plus for forecast (Pipewright 1.1)."
bqml.options: "CREATE MODEL options, for example {max_iterations: 50, l2_reg: 0.1}. Pipewright sets the label, the split, the key, the registry and explanations itself, so those options are refused."
bqml.transform: "A .sql file with the expressions of a TRANSFORM clause (without TRANSFORM ( ... )), for preparation the model needs when it is served: BigQuery ML applies it in ML.PREDICT and at a Model Registry endpoint. Pinned by the release."
bqml.prepare: "A .sql file with a SELECT over {rows} (the run's rows): preparation in SQL, pinned by the release. Its output is written into the run's rows before training; scoring runs the same file. An endpoint runs no SQL, so preparation needed online belongs in bqml.transform."
bqml.metrics_table: "A table in outputs.bigquery.tables that gets one row per training run, approved or refused, with the columns of the churn example's model_metrics.json (run_id, decision, primary_value, champion_value and the rest), so BigQuery ML runs sit in the same history as container runs (Pipewright 1.2.0)."
bqml.contract_on: "Which rows the data contract checks: prepared (the default) checks the output of bqml.prepare; source checks the rows as read, before bqml.prepare, as the container path does, so preparation may rescale or derive columns without breaking the contract's ranges (Pipewright 1.2.0)."
bqml.explain: "Compute global explanations when the model is created (ML.GLOBAL_EXPLAIN). Left out, explainability.enabled."
model.serving.features: "online: the endpoint takes entity IDs (data.features_from.entity.columns) and reads every feature from the tenant's online store, so serving, batch scoring and training share one feature definition (Pipewright 1.1). request (the default): callers send the feature values."
data.features_from.sources.online_view: "The feature view in the tenant's online store that serves this source's features (model.serving.features online). Default: the feature group's name."
evaluation.fairness: "Bias measures per attribute on the test set (binary classification, Pipewright 1.1): the largest gap between the attribute's groups. Recorded in the evaluation record and the model card; gates refuse a model above a maximum."
evaluation.fairness.attributes: "Columns of the data contract to measure by, for example gender or age_band. They need not be features and may be personal data: they are measured, never trained on."
evaluation.fairness.metrics: "demographic_parity_difference (selection rates), equal_opportunity_difference (true positive rates), equalized_odds_difference (the larger of the true and false positive rate gaps). Default: all three."
evaluation.fairness.gates: "A maximum per measure, for example {metric: demographic_parity_difference, max: 0.1}. Pipewright rechecks them before a version becomes the default."
evaluation.fairness.gates.metric: "The fairness measure this gate limits."
evaluation.fairness.gates.max: "The largest gap allowed between the attribute's groups, from 0 to 1."
evaluation.fairness.min_rows: "Groups with fewer test rows are listed but not measured (default 30), so a tiny group cannot decide a gate."
bqml.import: "A model trained elsewhere (TensorFlow SavedModel or ONNX), imported into BigQuery ML instead of trained there, then evaluated on the run's test rows, gated and registered like a trained one (Pipewright 1.1). Instead of bqml.model_type; no options, transform or explain."
bqml.import.format: "tensorflow or onnx (XGBoost imports need input and output schemas: not supported yet)."
bqml.import.path: "gs://.../* : the model's files, readable by the tenant's runner. Their checksums are recorded with the run."
bqml.import.outputs: "Which output column of the model holds what: score (the positive class probability, binary), label (the predicted class, multi-class) or prediction (regression)."
bqml.import.outputs.score: "The output column with the positive class probability (binary classification)."
bqml.import.outputs.score_index: "When the score column is an array of class probabilities: the positive class's position in it (from 0)."
bqml.import.outputs.label: "The output column with the predicted class (multi-class; optional for binary)."
bqml.import.outputs.prediction: "The output column with the prediction (regression)."
bqml.forecast: "A forecast (data.label.task forecast, Pipewright 1.1): the series is data.label.column over data.split.time_column, one series per id_columns value. Training holds out the latest period (data.split.test_fraction of the time range), forecasts it and measures the forecast against what happened (mae, rmse, mape); scoring writes the next horizon points to inference.output_table (forecast_timestamp, forecast_value, the interval and the ID columns)."
bqml.forecast.engine: "arima_plus (the default: CREATE MODEL ARIMA_PLUS, registered like any BigQuery ML model) or ai_forecast (AI.FORECAST with Google's TimesFM model: no model is trained, the version holds the settings it was measured with). ai_forecast sends the series to a Google foundation model, an exception to C-08 the platform allows with policies.bqml.ai_forecast."
bqml.forecast.horizon: "How many time points scoring forecasts, per series (at most 10000)."
bqml.forecast.id_columns: "The columns that tell series apart (for example a store), from data.contract.columns. Left out, the rows are one series."
bqml.forecast.confidence_level: "The share of future values the prediction interval should hold. Default 0.95."
bqml.forecast.model: "ai_forecast only: the TimesFM model. TimesFM 2.5 (generally available)."
bqml.forecast.context_window: "ai_forecast only: how many of the latest points the model reads. Left out, the smallest window that covers the history."
bqml.max_bytes_billed: "The most bytes one BigQuery ML job of this use case may bill. Left out, the platform's policies.bqml.max_bytes_billed, else 100 GiB. Tree models bill far more bytes than linear ones."
synthetic: Synthetic data generation. Off unless enabled; with it off nothing is compiled, built or released for it.
synthetic.enabled: Switches synthetic data on for this use case. May differ per environment (for example on in production-grade environments only).
synthetic.purpose: Sets the default gates. test-data stays in the organisation; sharing leaves it and has stricter privacy gates.
synthetic.tier: learned (an engine learns from real data inside this environment, in the synthetic pipeline) or contract (rows from the data contract and rules alone, no real data, from `pipewright synthetic generate`).
synthetic.source_uri: The data the engine learns from, bq:// or gs://, read point in time like training (with data.features_from, the entity table; with data.label_source and a table without the label column, its labels come from the label window, as in training; Pipewright 1.2.0).
synthetic.output_table: The table in outputs.bigquery.tables that receives the synthetic rows. Its schema holds the contract's columns and a run_id column.
synthetic.rows: "How many rows to generate. Default: as many as the source has. May differ per environment."
synthetic.holdout_fraction: Real rows kept back from the engine, to test utility and privacy against.
synthetic.seed: "Seed for the holdout split and the rules. Default: training.seed."
synthetic.engine: The engine and its settings. Every candidate starts from these.
synthetic.engine.type: mostlyai (MOSTLY AI Synthetic Data SDK in local mode, Apache-2.0, the default) or sdv (SDV, only if your team installs it under its own licence; see synthetic.requirements).
synthetic.engine.model: "mostlyai: MOSTLY_AI/Small, MOSTLY_AI/Medium (default) or MOSTLY_AI/Large. sdv: gaussian_copula, ctgan, tvae or copulagan."
synthetic.engine.max_training_minutes: The training time limit per candidate. May differ per environment.
synthetic.engine.differential_privacy: Trains with a differential privacy budget (mostlyai). Lowers privacy risk at a cost in fidelity and utility.
synthetic.engine.differential_privacy.epsilon: The privacy budget; lower is more private.
synthetic.engine.sampling_temperature: "mostlyai: above 1 spreads generated rows further from the training rows (more private, less faithful). Chosen at generation, so it costs no extra training."
synthetic.engine.rare_categories: "mostlyai: rare categories become a _RARE_ token (constant) or common categories (sample)."
synthetic.engine.epochs: "sdv deep synthesizers (ctgan, tvae, copulagan): training epochs."
synthetic.candidates: "Variants of the engine tried side by side, each with a name; the best one that passes every gate is kept. Default for mostlyai: the engine as given and the same at sampling temperature 1.3."
synthetic.candidates.type: As synthetic.engine.type, for this candidate.
synthetic.candidates.model: As synthetic.engine.model, for this candidate.
synthetic.candidates.max_training_minutes: As synthetic.engine.max_training_minutes, for this candidate.
synthetic.candidates.differential_privacy: As synthetic.engine.differential_privacy, for this candidate.
synthetic.candidates.differential_privacy.epsilon: The privacy budget for this candidate.
synthetic.candidates.sampling_temperature: As synthetic.engine.sampling_temperature, for this candidate.
synthetic.candidates.rare_categories: As synthetic.engine.rare_categories, for this candidate.
synthetic.candidates.epochs: As synthetic.engine.epochs, for this candidate.
synthetic.columns: "Columns decided by rules instead of learned: keys, personal data, time grids. Personal-data columns without a rule become new keys (if unique) or nulls; they are never learned."
synthetic.columns.<name>: "One column decided by a rule instead of learned, by its name in the source table."
synthetic.columns.<name>.rule: key (new unique keys), fake (made-up personal data), constant, drop (null), time (dates on a grid), values (a categorical with chosen frequencies) or range (uniform between min and max).
synthetic.columns.<name>.prefix: "rule key: the text before the number (default SYN-)."
synthetic.columns.<name>.provider: "rule fake: email, name, phone, uuid or text. Emails use example.com and phone numbers the reserved drama range."
synthetic.columns.<name>.value: "rule constant: the value."
synthetic.columns.<name>.from: "rule time: the first date (YYYY-MM-DD)."
synthetic.columns.<name>.to: "rule time: the last date (YYYY-MM-DD)."
synthetic.columns.<name>.step: "rule time: day (any day) or month_end (the last day of each month)."
synthetic.columns.<name>.values: "rule values: the values to choose from."
synthetic.columns.<name>.weights: "rule values: how often each value appears, one number per value."
synthetic.columns.<name>.min: "rule range: the lowest value."
synthetic.columns.<name>.max: "rule range: the highest value."
synthetic.sensitive_columns: Columns an inference attack tries to recover, besides the label (for example a health condition).
synthetic.gates: Overrides of the purpose's gates. Pipewright recomputes every gate before publishing; privacy gates may only be made stricter.
synthetic.gates.fidelity: How closely the synthetic data matches the real data's distributions (SDMetrics quality score, 0 to 1).
synthetic.gates.fidelity.min: "The lowest acceptable score. Defaults: 0.90 (test-data), 0.85 (sharing)."
synthetic.gates.tstr_drop: How much worse a model trained on synthetic data scores on real data (AUC) than one trained on real data.
synthetic.gates.tstr_drop.max: "The largest acceptable drop. Defaults: 0.05 (test-data), 0.08 (sharing)."
synthetic.gates.exact_copies: The share of synthetic rows identical to a training row.
synthetic.gates.exact_copies.max: Default 0 for both purposes.
synthetic.gates.dcr_ratio: How far synthetic rows are from the training rows compared with unseen real rows (median distance to the closest record). Below 1 is a sign of copying.
synthetic.gates.dcr_ratio.min: "Defaults: 0.9 (test-data), 1.0 (sharing)."
synthetic.gates.closer_than_p5: The share of synthetic rows closer to a training row than 95% of unseen real rows are. Independent data gives about 5%.
synthetic.gates.closer_than_p5.max: "Defaults: 0.10 (test-data), 0.05 (sharing)."
synthetic.gates.singling_out: The risk that an attacker can single out one real person (Anonymeter, upper confidence bound).
synthetic.gates.singling_out.max: "Defaults: 0.30 (test-data), 0.20 (sharing)."
synthetic.gates.linkability: The risk that an attacker can link records of one real person (Anonymeter, upper confidence bound).
synthetic.gates.linkability.max: "Defaults: 0.10 (test-data), 0.05 (sharing)."
synthetic.gates.inference: The risk that an attacker can infer the label or a sensitive column of a real person (Anonymeter, upper confidence bound, the worst column).
synthetic.gates.inference.max: "Defaults: 0.50 (test-data), 0.25 (sharing)."
synthetic.evaluation: How candidates are scored.
synthetic.evaluation.attacks: Anonymeter attacks per risk (default 1000). Fewer give confidence bounds too wide to gate on.
synthetic.requirements: A requirements file of extra packages for the synthetic image, for example SDV (installed by your team, which accepts its licence directly).
synthetic.mode: "flat (default): one table, the source as training reads it. relational: the entity table and its child tables learned together in one model, the feature tables of data.features_from (history per entity) and synthetic.sequences (events per entity); keys stay consistent and history keeps its timing against each cut-off."
synthetic.output_tables: "relational: the output table (in outputs.bigquery.tables) of each child table, by its name: a feature table by its feature group or table name, a sequence by its name. Each holds the child's columns and run_id."
synthetic.output_tables.<name>: "The output table of one child table, by the child table's name."
synthetic.sequences: "relational: event tables per entity, beyond the feature tables (for example transactions or sessions), generated in order with the entity table."
synthetic.sequences.name: The child table's name (output_tables uses it).
synthetic.sequences.source_uri: The event table, bq://project.dataset.table. Only rows of the source's entities are read.
synthetic.sequences.key: The column that refers to the entity table's key.
synthetic.sequences.order_by: The column the events are ordered by within each entity (usually a timestamp).
synthetic.sequences.columns: The columns to learn and generate (default all). Keys and personal data among them are never learned as values.

tests: How `pipewright test` checks the use case's code (the CI pull-request workflow runs it), and with tests.on_release `pipewright release` too.
tests.command: The command run in the use case folder; it must exit 0.
tests.environment: Where tests.command runs. pipewright (the default) is Pipewright's own interpreter; components is a virtual environment built from components/requirements.txt and cached by its hash, so a test that imports a component finds numpy, pandas or torch in CI too (Pipewright 1.2.0).
tests.on_release: When true, `pipewright release` runs tests.command before it builds anything and stops on a non-zero exit (default false, so the release does not run the tests; Pipewright 1.2.0).

outputs: Where the use case's tables are written.
outputs.store: bigquery (tables), gcs (Parquet files plus BigQuery external tables) or both, for example while moving to a lake.
outputs.gcs: Parquet output on Cloud Storage, when outputs.store is gcs or both.
outputs.gcs.format: The file format.
outputs.gcs.external_tables: Whether BigQuery external tables of the same names are created over the files, so SQL keeps working.
outputs.bigquery: BigQuery tables the use case owns, created and evolved by `pipewright tables sync` (additive changes only).
outputs.bigquery.tables: The tables, by name.
outputs.bigquery.tables.<name>: A table, with its schema file, partitioning, clustering and description.
outputs.bigquery.retention_days: Days before partitions are deleted.

model: The model in the Model Registry and how it is served.
model.name: The model's display name in the Model Registry.
model.promotion: "How a model reaches the next environment with `pipewright promote`: model copies the approved version's files and registers them there as a candidate, retrain trains it again there from the same release. A BigQuery ML model is promoted by retraining, except logistic_reg and linear_reg, which may use model (exported, imported and checked to score the same)."
model.serving: Online serving on an endpoint, deployed with `pipewright deploy-model`.
model.serving.enabled: Whether the model is served online. Needs online serving for the tenant.
model.serving.target: Where it is served.
model.serving.machine: The machine type, for example n1-standard-2.
model.serving.replicas: How many replicas serve.
model.serving.replicas.min: The fewest replicas.
model.serving.replicas.max: The most replicas, reached under load.
model.serving.canary_percent: The share of traffic a new version gets with `deploy-model --canary`.
model.serving.accelerator: A GPU for each replica (Pipewright 1.2.0), within the environment's policies.accelerators.serving. The machine must take it, for example g2-standard-8 with NVIDIA_L4.
model.serving.accelerator.type: The accelerator type, for example NVIDIA_L4.
model.serving.accelerator.count: How many per replica (default 1).
model.serving.scale_to_zero: With replicas.min 0, an idle endpoint runs no replica and costs nothing while idle; the first request after a quiet spell waits for a replica to start (Pipewright 1.2.0, an Agent Platform preview). Without it, min 0 deploys one replica, as in 1.x.
model.serving.drain_seconds: "Seconds a version that no longer takes traffic keeps serving before it is undeployed, on a replace, a promote or an abandoned canary (Pipewright 1.4.2, FR-109, default 240). After the traffic moves, the endpoint goes on routing requests to the old version for a few minutes; undeploying it at once answered them with 404. 0 undeploys at once, as before 1.4.2."
model.serving.fill_missing: The endpoint fills an empty feature (request or online) with the median the model was trained with, as batch scoring does (Pipewright 1.2.0, default true). Set false to answer an error naming the feature instead.
model.serving.pool: "Model co-hosting (Pipewright 1.4.2): deploy onto this shared pool of the environment (manifest serving.pools) instead of the use case's own machines, so several models share its machines. Only when your team wants co-hosting; leave it out and the use case deploys on its own machines as before. A pool runs Google's prebuilt TensorFlow or PyTorch (Preview) serving image only, the same one for every model on it; a custom serving image stays on dedicated machines. The pool sets the machines, so machine, replicas, accelerator and scale_to_zero are refused with it. Every change to any model on a pool restarts all its machines: Pipewright makes such changes one at a time and announces them."
model.serving.online_store: "Which online store serves the features (FR-104). Leave it out for the tenant's Bigtable online store (Pipewright 1.1). Needs model.serving.features online; the environment lists the types it offers. `pipewright doctor` shows each choice's standing cost."
model.serving.online_store.type: "bigtable (Feature Store, the default: about 12 ms, about $781 a month per node); bigquery (BigQuery with the environment's BI Engine reservation: about 200 ms, no copy of the data; unaccelerated lookups are billed as a full table read, for minutes after each refresh); cloudsql (PostgreSQL synced by Pipewright: about 3 ms direct, 12 ms through the lookup service, about $61 a month for the default instance); http (your own store answering POST /lookup)."
model.serving.online_store.bigquery.table: The served table in the tenant's dataset, one row per entity, refreshed by the sync. Default pw_online_<usecase>.
model.serving.online_store.bigquery.timeout_ms: How long a lookup may take before the endpoint fills or refuses the features (default 1000).
model.serving.online_store.cloudsql.schema: "The PostgreSQL schema the table goes in, created by the sync. Default public; in an instance other teams share, give your team a schema of its own (doctor warns about public). Pipewright never writes a schema or table another tenant owns."
model.serving.online_store.cloudsql.table: The table, one row per entity, created and replaced at each sync without lookups seeing half a load. Default pw_online_<usecase>.
model.serving.online_store.http.url: "Your lookup, an https:// URL answering POST /lookup {\"entity_ids\": [...]} with {\"features\": {id: {name: value}}}. Pipewright checks the names and types it gets back; what happens inside your store is yours."
model.serving.online_store.http.audience: The ID token audience the endpoint calls it with (default the URL).
model.serving.online_store.http.timeout_ms: How long a lookup may take (default 1000).
model.serving.online_store.lookup: "What sits between the endpoint and Cloud SQL: Pipewright's Cloud Run lookup service (provider pipewright, the default) sized here, or your own (provider own)."
model.serving.online_store.lookup.provider: "pipewright: Pipewright deploys and updates the lookup service with deploy-model. own: Pipewright syncs the table and grants `reader`; you decide what sits between the endpoint and the database (a service on GKE, your own Cloud Run, anything)."
model.serving.online_store.lookup.reader: With provider own, the tenant's service account that reads the table; Pipewright grants it SELECT on the table only.
model.serving.online_store.lookup.cpu: vCPU per instance, 1, 2, 4, 6 or 8 (default 1). Cloud Run's fractional CPU is refused, since it serves one request at a time.
model.serving.online_store.lookup.memory: Memory per instance (default 512Mi). Cloud Run takes up to 4Gi per vCPU, and at least 2Gi with 4 vCPU and 4Gi with 6 or 8.
model.serving.online_store.lookup.min_instances: "Instances kept warm so callers do not wait for a cold start (default 0, or the environment's default; never below its floor). Best effort: Google may restart one, so 2 keeps a spare. About $14 a month each (1 vCPU, 512Mi, idle)."
model.serving.online_store.lookup.max_instances: The most instances under load (default 5). pool_size x max_instances must fit the database's connections.
model.serving.online_store.lookup.concurrency: Requests one instance serves at once (default 80, 1 to 1000).
model.serving.online_store.lookup.pool_size: Database connections per instance (default 8, 1 to 50). A bounded pool keeps a burst from exhausting the database's connections.
model.serving.online_store.lookup.timeout_ms: How long one lookup may take (default 1000).
model.serving.online_store.lookup.cpu_boost: "Startup CPU boost (default true): double CPU while an instance starts and for 10 seconds after, so cold starts are shorter. About $0.0005 a start."
model.serving.online_store.lookup.billing: "request (default): idle warm instances are billed at the low idle rate. instance (CPU always allocated): the full rate for each instance's whole life and no per-request charge, cheaper only for steady high traffic (about $60 a month an instance)."
model.serving.online_store.lookup.mode: "lookup (the default): the endpoint calls the lookup service for its features. gateway (Pipewright 1.4.2): callers send entity IDs to the lookup service inside the network, which reads the features and calls the endpoint itself, so the endpoint never needs to reach into the network (Agent Platform endpoints cannot). With type cloudsql it reads Cloud SQL; with type http it calls your own lookup service inside the network (the Pipewright custom solution)."
model.serving.online_store.lookup.retries: "With mode gateway: how many more times a prediction is tried on 503, 429 or a dropped connection (default 3, so 4 tries, 0.25 to 2 seconds apart; 0 turns it off). A shared pool restarts its machines on every change, and the retries keep callers from seeing it."
model.serving.online_store.lookup.callers: "With mode gateway: who may call the gateway, as serviceAccount:, group: or user: members; they get run.invoker on the lookup service. Each call is logged with the caller's identity, never an ID or a feature value."
model.serving.online_store.sync: How Pipewright refreshes the served table (bigquery and cloudsql), on a schedule with pipeline online_sync.
model.serving.online_store.sync.mode: "full (default): every row at each sync. changed: only rows whose values changed, so the database works less while lookups run (a full 1M-row load on one vCPU raised lookup latency for about a minute)."
model.serving.online_store.export: "Publish each generation as Parquet files with a manifest, for a store you build yourself (off by default). Off, nothing is published: Pipewright's own sync moves the rows through a staging extract it deletes after the swap."
model.serving.online_store.export.enabled: Turn the export on (default false).
model.serving.online_store.export.uri: "Where the generations go, gs://bucket/prefix. Default gs://<artifacts bucket>/online-export/<tenant>/<usecase>; it must be somewhere your runner may write."
model.serving.online_store.export.keep: How many generations are kept (default 3); older ones are deleted after a successful sync.
model.serving.online_store.export.readers: Service accounts of your tenant given read on the export, for example the job that loads your own store.
model.serving.online_store.bigquery: Settings for type bigquery.
model.serving.online_store.cloudsql: Settings for type cloudsql.
model.serving.online_store.http: Settings for type http.

approvals: Which changes need a person.
approvals.promote_model: manual - a passing model is a candidate until `pipewright model approve`; auto - training makes it the default.
approvals.deploy_model: manual - `pipewright deploy-model` asks for --approve; auto - no confirmation; ci (Pipewright 1.2.0) - `pipewright decisions pending` lists a deploy-approve item for each new default version that passes its gates and is not served, and a pipewright-gate run deploys it once the GitHub environment's reviewers approve; on_register (1.2.0) - the pipewright-decisions workflow deploys such a version without a person.
approvals.approvers: Who may approve, as user:<email> or group:<email>.

features_store: Reserved for a later version; leave it out.
environments: Per-environment overrides, by environment name. Usually kept in environments/<env>.yaml instead.
feature_contract: "The approved definitions of the feature sources the use case reads (data.features_from), one entry per source (Pipewright 1.4.1, FR-103). `pipewright features contract` writes it from the live sources; commit it with the use case. It travels in the release contract, approvals record it, and with policies.integrity.features check on a definition that differs is an integrity problem. Without it, nothing changes."
feature_contract.version: "The contract's semantic version, MAJOR.MINOR.PATCH. `pipewright features contract` sets it: a removed or retyped column is major, changed SQL or an added column minor, descriptions a patch."
feature_contract.sources: "One entry per data.features_from source."
feature_contract.sources.name: "The source's name: its feature group, or its table's ID (the same in every environment)."
feature_contract.sources.kind: "view, materialized_view, table (built by a query, a pipeline or dbt) or scheduled_query: what the source's BigQuery object is."
feature_contract.sources.sql_sha256: "SHA-256 of the defining SQL, whitespace normalised and the source's own project written {project}: a view's or materialized view's from the object, a table's from its sql_file or scheduled query. Null for a table with neither (checked by schema only)."
feature_contract.sources.schema_sha256: "SHA-256 of the schema as names, types and modes (never descriptions)."
feature_contract.sources.schema: "The schema, one `name TYPE MODE` per column, for a readable diff."
feature_contract.sources.sql_file: "A table built by a query: the file holding the SQL that builds it, relative to the use case folder. With policies.integrity.features built_tables on, the SQL of the job that last wrote the table must match it."
feature_contract.sources.sql_files: "A table several jobs write (for example a backfill and a monthly append): each job's SQL file, relative to the use case folder. The first is recorded as sql_sha256, the others as also_sql_sha256; the built-table check accepts any of them (1.4.2)."
feature_contract.sources.also_sql_sha256: "Recorded from sql_files: the SHA-256 of each SQL file after the first. Part of the contract's digest."
feature_contract.sources.scheduled_query: "A table built by a BigQuery scheduled query: its transfer config name (projects/.../transferConfigs/...). Its SQL is fingerprinted from the config."
feature_contract.sources.features: "The features the use case reads from the source, each with its type and an optional description (kept when the contract is updated)."
feature_contract.sources.features.<name>: "One feature the use case reads from the source, by its column name."
feature_contract.sources.features.<name>.type: "The feature's BigQuery type, from the source's schema."
feature_contract.sources.features.<name>.description: "What the feature means, in business terms (yours to write; kept on updates)."

ab_test: "A/B testing of models (Pipewright FR-57): the champion against a candidate. Units are assigned stickily by a hash of the test's name and the unit key, the same in batch scoring and online; a business metric and guardrails are fixed before the start; a person decides. Off unless enabled; with it off nothing changes. Started with `pipewright ab start`."
ab_test.enabled: "Switches the test on for this use case. Usually set only in production's environment file. With it off the section is left out of the release."
ab_test.name: "The test's name: lower case letters, digits and hyphens. It salts the assignment, so a new name re-randomises the units; a name is used once per use case."
ab_test.mode: "ab (the default): units see their arm's model and the outcome is compared. shadow: the candidate scores copies of the live calls and nothing acts on its answers, to compare predictions, errors and latency before an A/B test."
ab_test.unit: "The data contract column units are assigned by, such as customer_id. Left out: data_protection.erasure.key_column, else the entity's first column."
ab_test.arms: "What each arm serves."
ab_test.arms.control: "champion: the default version when the test starts (the only control)."
ab_test.arms.treatment: "The candidate."
ab_test.arms.treatment.model_version: "The candidate's model version. It must have passed its gates and carry an approval record of its files (`pipewright model approve --candidate` records one without making it the default)."
ab_test.allocation: "How many units go to the treatment."
ab_test.allocation.treatment_bp: "The treatment's share in whole basis points (2000 is 20%; default 1000). While a test runs it may only go down (`pipewright ab set --allocation`), so units only ever move to the control. May differ per environment."
ab_test.metric: "The primary metric, fixed before the start (its digest is recorded): the outcome per unit within a window after the unit's first exposure."
ab_test.metric.name: "What the metric is called in the results, such as renewed_90d."
ab_test.metric.source: "A bq:// table of outcome events: one row per event, with the unit key and a time."
ab_test.metric.key: "The unit key's column in the source. Left out: ab_test.unit."
ab_test.metric.time_column: "When each event happened. Events count within window_days after a unit's first exposure, and only for units whose window has closed, so slow outcomes are not read as failures."
ab_test.metric.value_column: "mean and ratio metrics: the value summed per unit, such as revenue."
ab_test.metric.denominator_column: "ratio metrics: the denominator summed per unit, such as sessions. The interval uses the delta method."
ab_test.metric.where: "A SQL condition on the source's rows, such as event_type = 'renewal'."
ab_test.metric.window_days: "Days after a unit's first exposure in which its outcome counts (default 30)."
ab_test.metric.type: "proportion (a unit with at least one event in its window counts as 1), mean (the value summed per unit) or ratio (sum of value over sum of denominator)."
ab_test.metric.direction: "higher or lower: which way is better (default higher)."
ab_test.metric.minimum_effect: "The smallest absolute change worth detecting, such as 0.02 for two percentage points. It sizes the test: `pipewright ab plan` says how many units each arm needs."
ab_test.guardrails: "What must not get worse. Technical guardrails stop the treatment automatically; business guardrails open a decision case."
ab_test.guardrails.technical: "Online only: errors and latency per arm, from the gateway's breaker at once and Cloud Monitoring on the launcher's tick."
ab_test.guardrails.technical.max_error_rate_increase: "The most the treatment's error rate may exceed the control's (default 0.01)."
ab_test.guardrails.technical.max_latency_increase: "The most the treatment's median latency may exceed the control's, as a fraction (default 0.2)."
ab_test.guardrails.technical.min_requests: "Calls per arm before latency is judged, so a cold start is not held against the treatment (default 200)."
ab_test.guardrails.technical.breaker: "The gateway's own check, so a broken treatment stops within seconds rather than at the next tick."
ab_test.guardrails.technical.breaker.window: "The treatment's last N calls the breaker looks at (default 200)."
ab_test.guardrails.technical.breaker.max_error_rate: "Tripped when more than this share of those calls failed (default 0.05): the treatment's units go to the control at once and the test is stopped."
ab_test.guardrails.business: "Business metrics that must not drop, each measured like the primary metric."
ab_test.guardrails.business.name: "The guardrail's name in the results."
ab_test.guardrails.business.source: "A bq:// table of events, as for the metric."
ab_test.guardrails.business.key: "The unit key's column in the source. Left out: ab_test.unit."
ab_test.guardrails.business.time_column: "When each event happened."
ab_test.guardrails.business.value_column: "mean and ratio: the value summed per unit."
ab_test.guardrails.business.denominator_column: "ratio: the denominator summed per unit."
ab_test.guardrails.business.where: "A SQL condition on the source's rows."
ab_test.guardrails.business.window_days: "Days after first exposure (default: the metric's)."
ab_test.guardrails.business.type: "proportion, mean (the default) or ratio."
ab_test.guardrails.business.direction: "higher or lower: which way is better (default higher)."
ab_test.guardrails.business.max_drop: "The largest relative drop tolerated, such as 0.02. Breached when the drop is larger and significant (one-sided at analysis.alpha)."
ab_test.duration: "How long the test may run."
ab_test.duration.min_days: "No decision before this many days, whatever the numbers say (default 14): weekly patterns need at least two weeks."
ab_test.duration.max_days: "A decision case opens at this age even without the planned sample (default 60)."
ab_test.analysis: "How the arms are compared."
ab_test.analysis.method: "fixed (the default): decide once the planned sample and min_days are reached. sequential: an always-valid p-value (mSPRT), so the test may stop as soon as the evidence is clear without inflating false positives."
ab_test.analysis.alpha: "The false positive rate the test accepts (default 0.05)."
ab_test.analysis.power: "The chance of detecting minimum_effect when it is real (default 0.8)."
ab_test.analysis.schedule: "When the launcher analyses the test (cron, UTC; default daily at 06:00)."
ab_test.analysis.cuped: "Variance reduction with a pre-period covariate per unit (CUPED): the same confidence with fewer units. Spike S6: 10 to 15% on the book's data."
ab_test.analysis.cuped.enabled: "Switches CUPED on (default off)."
ab_test.analysis.cuped.covariate: "A value per unit known before the test, best last period's value of the metric itself: a column of cuped.source, read as of the test's start."
ab_test.analysis.cuped.source: "A bq:// table with the unit key, the covariate and feature_timestamp (a feature table): the newest value at or before the test's start is used."
ab_test.analysis.segments: "Data contract columns to break the result down by, such as country. Reported for reading, never used to decide (many segments find differences by chance)."
ab_test.analysis.tau: "sequential only: the mixing scale of the mSPRT. Left out: minimum_effect."
ab_test.decision: "Who decides the winner."
ab_test.decision.approvals: "Approvals the decision needs."
ab_test.decision.approvals.required: "Approver groups registered in the manifest; one approval from each, as for retrain decisions."
ab_test.publish: "A copy of the test for the team's own tools, over the Pub/Sub topic the platform provides per tenant (tenants.<t>.ab_test_feed). BigQuery stays the record. Off by default."
ab_test.publish.events: "The test's events: started, analysed, guardrail breached, decided (aggregates only)."
ab_test.publish.exposures: "Per-unit exposure lines with a pseudonymised unit (a keyed hash), only where the platform allows it (policies.ab_test.feed_exposures)."
ab_test.results_table: "The table the analysis writes its results to, in the use case's dataset. Left out: <usecase>_ab_results, created by the analysis."
ab_test.callers: "Online, for use cases whose callers send features: who may call the router the test runs behind (members such as serviceAccount:checkout@p.iam.gserviceaccount.com). With online features the gateway's callers apply (model.serving.online_store.lookup.callers)."
