# The minimal example: the churn example's training code with only the configuration Pipewright needs.
# `pipewright new-usecase --from minimal` copies these paths from the churn example, then this folder's files.
code_from: churn
code:
  - training_pipeline.py
  - components/
  - schemas/raw_customers.json
  - schemas/model_metrics.json
  - data/sample_customers.csv

# The sample values these files use, which `pipewright new-usecase` replaces with the new use case's own
# (--name, --tenant, --owner, --table-prefix, --model-name), in the files under templated only.
sample:
  usecase: my-churn-minimal
  tenant: my-tenant
  owner: my-team
  table_prefix: my_churn_minimal_
  model_name: my-churn-minimal-classifier
templated:
  - usecase.yaml
