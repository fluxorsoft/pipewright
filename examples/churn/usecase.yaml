# my-churn: created from the Pipewright churn example (pipewright new-usecase --from churn).
# This folder now belongs to my-team. Reference: CONTEXT.md in the Pipewright repository.
#
# This file says what the use case is and who governs it. Everything else is in config/, one concern per file:
#   config/triggers.yaml    what starts a run (landing files, schedules, API)
#   config/runtime.yaml     pipeline parameters, compute per step, the test command
#   config/tables.yaml      BigQuery tables the use case owns
#   config/data.yaml        data contract, label, split, features, personal data
#   config/training.yaml    hyperparameters, experiment, tuning
#   config/evaluation.yaml  metrics, gates, champion, slices, explainability, model card
#   config/operations.yaml  inference, monitoring, retraining
#   config/synthetic.yaml   synthetic data (off until your team needs it)
#   config/ab_test.yaml     an A/B test of a candidate against the champion (off until you run one)
#   environments/<env>.yaml per-environment overrides
# `pipewright resolve --env <env>` shows the merged result.
apiVersion: pipewright/v1
kind: UseCase
metadata:
  name: my-churn
  owner: my-team
  description: Predicts which customers are likely to cancel in the next month.
  objective: Rank customers by churn risk so the retention team can contact the riskiest first.
  labels: { product: churn, data-classification: confidential }

spec:
  tenant: my-tenant                      # given to you by the platform team
  include: [config/*.yaml]

  pipelines:
    training:  { file: training_pipeline.py,  function: churn_training_pipeline }
    inference: { file: inference_pipeline.py, function: churn_inference_pipeline }
    monitoring: { file: monitoring_pipeline.py, function: churn_monitoring_pipeline }   # 1.4.3: online monitoring
  components: { dir: components/, requirements: components/requirements.txt }
  # default components.base_image: null       # the environment's base (python:3.11-slim or its mirror); a CUDA
  #                                           # image for GPU training goes here, within the approved base images
  framework:  pytorch

  model:
    name: my-churn-classifier
    promotion: model
    serving: { enabled: false, target: vertex, machine: n1-standard-2, canary_percent: 10 }
    # 1.4.3 (FR-98): record a sample of what the endpoint receives and answers (for monitoring.online)
    # e.g. capture: { enabled: true, sample_rate: 0.05, max_per_day: 100000, retention_days: 30 } inside serving
    # Lines starting `# default` show what Pipewright fills in when a key is left out (a test keeps them true;
    # `pipewright resolve --env <env>` shows the merged result, `pipewright explain <key>` what a key means):
    # default model.serving.replicas: { min: 1, max: 1 }   # min 0 needs scale_to_zero
    # default model.serving.features: request        # online: callers send entity IDs, features come from the store
    # default model.serving.fill_missing: true       # an empty feature gets its training median, as in batch scoring
    # default model.serving.scale_to_zero: false     # true with replicas.min 0: no replica while idle (preview)
    # default model.serving.drain_seconds: 240        # the old version keeps serving this long after traffic moves (1.4.2)
    # default model.serving.accelerator: null        # e.g. { type: NVIDIA_L4, count: 1 }, within the platform's list
    # default model.serving.pool: null               # 1.4.2: a shared pool of the environment, only for co-hosting
    #                                                # (Google's TF or PyTorch serving image; it sets the machines)

  approvals:
    promote_model: manual                # a passing model is a candidate until `pipewright model approve`
    deploy_model: manual                 # also: auto, ci (a GitHub-approved gate), on_register (the workflow)
    # default approvals.approvers: []      # e.g. [user:lead@example.com]: who may run --approve
