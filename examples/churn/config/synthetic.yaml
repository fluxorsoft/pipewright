# Synthetic data: off until your team needs it. With it off, nothing is built, compiled or released for it.
#
# learned (switch on with enabled: true): an engine learns from the real data inside this environment, in the
#   synthetic pipeline Pipewright provides (`pipewright run --pipeline synthetic`, or a schedule with
#   pipeline: synthetic). Pipewright scores every candidate (fidelity, utility, privacy), recomputes the gates of
#   the purpose, and appends the best passing one to output_table. Also add that table to outputs.bigquery.tables
#   in usecase.yaml: the contract's columns plus a run_id column (STRING).
# contract: no real data at all. `pipewright synthetic generate --env dev --usecase <name> --out rows.csv` writes
#   rows from data.contract and the rules below, for development, CI and demos.
#
# `pipewright synthetic gates --env <env> --usecase <name>` lists the gates in force; `pipewright explain synthetic`
# describes every key.
synthetic:
  enabled: false
  purpose: test-data                     # test-data stays in the organisation; sharing has stricter privacy gates
  tier: learned
  # source_uri: bq://${project}.${resources.bigquery_dataset}.<training table>    # read like training data
  # output_table: synthetic_customers
  engine:                                # MOSTLY AI SDK in local mode (Apache-2.0)
    type: mostlyai
    max_training_minutes: 10             # the ceiling; with max_epochs set, training normally ends sooner
    # Repeatable runs (1.4.3): the same rows and the same gate results every time, on any machine, so an approval
    # can be reproduced. Both null (the default) = time-bound training from a new random state, as before 1.4.3.
    max_epochs: 3                        # a fixed amount of training (20,000 rows, Small model: about 2 minutes)
    seed: 42                             # one seed for training and generation
    # default synthetic.engine.sampling_temperature: 1.0   # lower: closer to common rows, higher: more variety
    # default synthetic.engine.rare_categories: constant   # rare values replaced (privacy); sample keeps them
    # default synthetic.engine.differential_privacy: null  # e.g. { epsilon: 5.0 }: training with a privacy budget
  # default synthetic.rows: null                 # how many rows to write; null: as many as the source
  # default synthetic.holdout_fraction: 0.2      # real rows kept out of training, to measure privacy and utility
  columns:                               # decided by rules, never learned
    customer_id: { rule: key, prefix: "SYN-" }
    snapshot_date: { rule: time, from: "2025-01-31", to: "2025-12-31", step: month_end }   # contract tier
