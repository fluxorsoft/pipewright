# Operations: scoring new data, watching the model in use, and when to retrain.
inference:
  output_table: my_churn_predictions
  decision_threshold: 0.5

monitoring:
  output_table: my_churn_model_monitoring
  alerts:                                 # `pipewright alerts sync` turns these into email alerts
    notify: []                            # e.g. [team-ml@yourcompany.com, ml-oncall@yourcompany.com] (lists work)
    events: [monitoring.alert, training.rejected]   # also: model.registered, training.evaluated
    severity: WARNING
  drift: { enabled: true, method: psi, threshold: 0.2 }     # features default to the model's features
  prediction_drift: { enabled: true, threshold: 0.2 }
  # 1.4.3 (FR-98): your monitor steps on live traffic (monitoring_pipeline.py), from what capture records
  # (model.serving.capture in usecase.yaml). Below min_samples a window is insufficient_data, never "no drift".
  online:
    enabled: false
    schedule: "0 6 * * *"                 # daily (UTC); hourly for busy models
    window_hours: 24
    min_samples: 500
    attribution: { enabled: false, sample_rows: 500, threshold: 0.10 }   # which features drive the answers
  # 1.4.3 (FR-98): alert policies on each deployed version; their incidents arrive on Pub/Sub as serving.degraded
  # and serving.recovered (the platform turns on the incident channel: serving_health in the starter)
  health:
    enabled: false
    error_rate: { warning: 0.01, critical: 0.05 }
    latency_p95_ms: { warning: 500, critical: 1000 }
    min_ready_replicas: 1
    scaling_minutes: 5                    # replicas wanted but not ready this long: a stuck scale-up
    propose_rollback_hours: 0             # > 0: a critical breach soon after a deploy proposes a rollback (a person decides)
  performance:                            # once outcomes arrive: join predictions to observed churn
    enabled: true
    labels: { table: my_churn_churn_outcomes, key: customer_id, label: churned }
    metric: auc
    min: 0.7
    # default monitoring.performance.labels.time_column: null   # set it to join outcomes on key and time

retraining:                             # drift or a performance drop opens a case; a person decides
  mode: propose                         # off (alerts only) | propose | candidate (trains, never promotes)
  when: [drift, performance]            # what opens a case
  cooldown_days: 7                      # after an approved retrain, alerts are recorded but open no new case
  source_uri: gs://${buckets.landing}/samples/my-churn/customers.csv   # default data; approvers may choose
  decisions:
    notify: []                          # emailed the case summary and ID; email never approves
    publish: false                      # true: also on your team's decision feed (Pub/Sub), for your own apps
    escalate_after_days: 3
    escalate_notify: []
    # default retraining.decisions.digest: true                 # a weekly digest of open cases
  approvals:
    required: []                        # approver groups the platform registered, e.g. [ml-leads, model-risk]
    separate_from_requester: true
  snooze: { max_days: 30, reopen_when_worse_by: 0.1 }
  # The closed retrain loop: production never trains; an approved case trains in the environment releases come from
  # (promotion.from). Usually set in the production environment's file (environments/<prod>.yaml), off by default:
  # loop:
  #   enabled: true
  #   safeguards: {}           # 1.4.0, for loops started without a person (mode candidate): 1 loop per 7 days,
  #                            # pause after 2 failures in a row, drift on 2 runs in a row; or set each:
  #                            # { max_loops: 1, per_days: 7, pause_after_failures: 2, drift_runs: 2 }
  #   canary:                  # 1.4.0, served on an Agent Platform endpoint: canary, check, promote or roll back
  #     { percent: 10, soak_minutes: 30, max_error_rate_increase: 0.01, max_latency_increase: 0.2,
  #       min_requests: 50, probe: true }
  #   data: test               # 1.4.0: or production (its feature tables and label window, read in place)
