# The feature tables example: the churn example's training code, with most features read from feature tables
# instead of one prepared table. `pipewright new-usecase --from features` copies these paths from the churn
# example, then this folder's files.
code_from: churn
code:
  - training_pipeline.py
  - inference_pipeline.py
  - components/
  - schemas/raw_customers.json
  - schemas/model_metrics.json
  - schemas/predictions.json
  - schemas/model_monitoring.json

# The sample values these files use, which `pipewright new-usecase` replaces with the new use case's own
# (--name, --tenant, --owner, --table-prefix, --model-name), in the files under templated only.
sample:
  usecase: my-churn-features
  tenant: my-tenant
  owner: my-team
  table_prefix: my_churn_features_
  model_name: my-churn-features-classifier
templated:
  - config/data.yaml
  - usecase.yaml
