# The Ray example: the churn example's training code, with the tuning trials run in parallel on a Ray on Agent Platform
# cluster that exists only for that step of the run. `pipewright new-usecase --from ray` copies these paths from
# the churn example, then this folder's files (which replace components/requirements.txt).
code_from: churn
code:
  - components/
  - schemas/raw_customers.json
  - schemas/model_metrics.json
  - data/sample_customers.csv

# The sample values these files use, which `pipewright new-usecase` replaces with the new use case's own
# (--name, --tenant, --owner, --table-prefix, --model-name), in the files under templated only.
sample:
  usecase: my-churn-ray
  tenant: my-tenant
  owner: my-team
  table_prefix: my_churn_ray_
  model_name: my-churn-ray-classifier
templated:
  - usecase.yaml
