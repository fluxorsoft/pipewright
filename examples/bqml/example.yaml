# The BigQuery ML example: the feature tables example's data, trained and scored in BigQuery. No pipeline code:
# Pipewright provides the pipelines for a use case with a bqml section. `pipewright new-usecase --from bqml`
# copies these paths from the feature tables example, then this folder's files.
code_from: features
code:
  - data/

# The sample values these files use, which `pipewright new-usecase` replaces with the new use case's own
# (--name, --tenant, --owner, --table-prefix, --model-name), in the files under templated only.
sample:
  usecase: my-churn-bq
  tenant: my-tenant
  owner: my-team
  table_prefix: my_churn_bq_
  model_name: my-churn-bq-classifier
templated:
  - config/data.yaml
  - usecase.yaml
